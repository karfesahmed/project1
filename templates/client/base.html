{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/client/main.css' %}">
    <title>luffy</title>
    <style>
        .hero{
            background-image:linear-gradient(-26deg,rgba(0, 0, 0, 0)  0%, rgba(0, 0, 0, 0.8) 100%),
                            url("{% static 'images/background.png' %}");
            background-repeat: no-repeat;
            background-size: cover;
            min-height:100svh;
            background-position-x: 74%;
        }
    </style>
</head>
<body>
    
    <nav>
        <div class="logo">
            <a href="">
                <img src="{% static 'images/logo.png' %}" alt="">
                <div class="store-name">LUFFY</div>
            </a>
            
            
        </div>
        <div class="links">
            <ul>
                <li><a class="current-link" href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Categories</a></li>
                <li><a href="#">Best products</a></li>
                <li><a  href="#">Best products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
        
    </nav>
    {% block content %}
    {% endblock content %}
    <footer>
        <div class="footer-content">
            <h3>Social Media</h3>
            <ul>
                <li><a href="">Instagram</a></li>
                <li><a href="">Facebook</a></li>
                <li><a href="">Tiktok</a></li>
                <li><a href="">Youtube</a></li>
            </ul>
        </div>
        <div class="footer-copyright">
            <p>Copyright © 2026 Luffy Store. All Rights Reserved</p>
        </div>
    </footer>
</body>
</html>
